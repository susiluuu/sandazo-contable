# Plantilla orientativa. Revisar costos, región y almacenamiento persistente antes de desplegar.
services:
  - type: web
    name: sandazo-contable
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sandazo-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: '1'
databases:
  - name: sandazo-postgres
    databaseName: sandazo
    user: sandazo
